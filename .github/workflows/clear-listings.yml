# This workflow clears the listings.json file daily at midnight and pushes the changes to the repository. It also allows for manual triggering for testing purposes.
name: Clear Listings Daily
on:
  schedule:
    - cron: '0 0 * * *'  # Runs at midnight (00:00) every day
  workflow_dispatch:  # Manual trigger for testing

jobs:
  clear:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    
    env:
      
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    
    # ✅ Only need contents: write for committing the state file
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
    
    - name: Install dependencies
      run: npm install @supabase/supabase-js
    
    - name: Clear listings from Supabase
      run: |
        node -e "
          const { createClient } = require('@supabase/supabase-js');
          
          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_PUBLISHABLE_KEY
          );
          
          async function clearListings() {
            console.log('🗑️ Clearing listings from Supabase...');
            
           
            const { data, error } = await supabase
              .from('listings')
              .delete()
              .neq('id', '00000000-0000-0000-0000-000000000000');