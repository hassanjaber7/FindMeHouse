<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe - Apartment Alerts</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 50px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 28px; color: #1a202c; }
        .header p { color: #718096; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 600; color: #2d3748; margin-bottom: 6px; font-size: 14px; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            background: #f7fafc;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
            background: white;
        }
        .price-row { display: flex; gap: 15px; }
        .price-row .form-group { flex: 1; }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(102,126,234,0.4); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .message { margin-top: 20px; padding: 16px; border-radius: 12px; display: none; text-align: center; }
        .message.success { display: block; background: #f0fff4; color: #38a169; border: 1px solid #9ae6b4; }
        .message.error { display: block; background: #fff5f5; color: #e53e3e; border: 1px solid #feb2b2; }
        .message.info { display: block; background: #ebf8ff; color: #3182ce; border: 1px solid #90cdf4; }
        @media (max-width: 480px) { .container { padding: 30px 20px; } .price-row { flex-direction: column; gap: 0; } }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🏠 Apartment Alerts</h1>
            <p>Get notified when new listings match your criteria</p>
        </div>

        <form id="subscribeForm">
            <!-- Email (No password!) -->
            <div class="form-group">
                <label for="email">📧 Email</label>
                <input type="email" id="email" placeholder="you@example.com" required>
                <div class="hint" style="font-size:12px; color:#a0aec0; margin-top:5px;">
                    We'll send a magic link to confirm your subscription
                </div>
            </div>

            <div class="form-group">
                <label for="city">📍 City</label>
                <input type="text" id="city" placeholder="Warsaw" required>
            </div>

            <div class="price-row">
                <div class="form-group">
                    <label for="minPrice">💰 Min Price (PLN)</label>
                    <input type="number" id="minPrice" placeholder="1000" required>
                </div>
                <div class="form-group">
                    <label for="maxPrice">💰 Max Price (PLN)</label>
                    <input type="number" id="maxPrice" placeholder="2500" required>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">🔔 Subscribe</button>
        </form>

        <div id="message" class="message"></div>

        <p style="text-align: center; margin-top: 15px; font-size: 14px; color: #a0aec0;">
            Already subscribed? <a href="/unsubscribe.html" style="color: #667eea;">Unsubscribe</a>
        </p>
    </div>

    <!-- ✅ Supabase Client + Magic Link Logic -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        // ============================================
        // ✅ CONFIGURATION - REPLACE WITH YOUR VALUES!
        // ============================================
        

        const SUPABASE_URL = 'https://qjifzezqbrdlyjuzggwc.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_wkYphmAXQKQPdgBtixtK6Q_Fv7Dz4oL';

        

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        // ============================================
        // ✅ DOM REFERENCES
        // ============================================

        const form = document.getElementById('subscribeForm');
        const emailInput = document.getElementById('email');
        const cityInput = document.getElementById('city');
        const minPriceInput = document.getElementById('minPrice');
        const maxPriceInput = document.getElementById('maxPrice');
        const submitBtn = document.getElementById('submitBtn');
        const messageEl = document.getElementById('message');

        // ============================================
        // ✅ HELPERS
        // ============================================

        function showMessage(text, type = 'info') {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
            clearTimeout(window.messageTimeout);
            window.messageTimeout = setTimeout(() => {
                messageEl.className = 'message';
            }, 8000);
        }

        function setLoading(isLoading) {
            submitBtn.disabled = isLoading;
            submitBtn.textContent = isLoading ? '⏳ Sending...' : '🔔 Subscribe';
        }

        // ============================================
        // ✅ MAGIC LINK SUBSCRIPTION
        // ============================================

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // 1. Get form values
            const email = emailInput.value.trim();
            const city = cityInput.value.trim();
            const minPrice = parseInt(minPriceInput.value);
            const maxPrice = parseInt(maxPriceInput.value);

            // 2. Validate
            if (!email) { showMessage('📧 Please enter your email.', 'error'); return; }
            if (!city) { showMessage('📍 Please enter a city.', 'error'); return; }
            if (isNaN(minPrice) || minPrice < 0) { showMessage('💰 Please enter a valid minimum price.', 'error'); return; }
            if (isNaN(maxPrice) || maxPrice < 0) { showMessage('💰 Please enter a valid maximum price.', 'error'); return; }
            if (minPrice > maxPrice) { showMessage('⚠️ Min price cannot be greater than max price.', 'error'); return; }

            // 3. Show loading state
            setLoading(true);
            showMessage('⏳ Sending magic link...', 'info');

            try {
                // ✅ 4. Store subscription preferences temporarily (before email verification)
                // This data will be retrieved on the confirmation page
                const subscriptionData = {
                    email: email,
                    city: city,
                    minPrice: minPrice,
                    maxPrice: maxPrice,
                    timestamp: new Date().toISOString()
                };

                // Save to localStorage (or you could use sessionStorage)
                localStorage.setItem('pending_subscription', JSON.stringify(subscriptionData));

                // ✅ 5. Send the magic link via Supabase
                const { error } = await supabase.auth.signInWithOtp({
                    email: email,
                    options: {
                        // ⚠️ IMPORTANT: This must be your actual domain
                        // The user will be redirected here after clicking the magic link
                        emailRedirectTo: 'https://hassanjaber7.github.io/FindMeHouse/confirm.html',
                    },
                });

                if (error) {
                    // ❌ Error sending magic link
                    showMessage('❌ ' + error.message, 'error');
                    console.error('Magic link error:', error);
                } else {
                    // ✅ Magic link sent successfully!
                    showMessage(
                        '✅ Magic link sent! 📧\n\n' +
                        'Please check your email and click the link to confirm your subscription.\n\n' +
                        '📩 Sent to: ' + email,
                        'success'
                    );
                    form.reset();
                }

            } catch (error) {
                // ❌ Network or other error
                console.error('Error:', error);
                showMessage('❌ Something went wrong. Please try again.', 'error');
            }

            setLoading(false);
        });

        console.log('🚀 Subscription page loaded!');
    </script>

</body>
</html>
