<!DOCTYPE html>
<html>

<head>
    <title>Confirm Subscription</title>
</head>

<body>
    <div id="status">⏳ Confirming your subscription...</div>
    <div id="details"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ✅ Supabase client (only for getting session)
        const SUPABASE_URL = 'https://qjifzezqbrdlyjuzggwc.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_wkYphmAXQKQPdgBtixtK6Q_Fv7Dz4oL';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);


        (async function () {

            // 1️⃣ Get the session (user is authenticated)
            const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();

            if (sessionError || !session) {
                console.error('Error getting session:', sessionError);
                document.getElementById('status').innerText = '❌ Invalid or expired session';
                return;
            }

            const user = session.user;





            // Send data to serverless function (NOT directly to Supabase)
            const response = await fetch('/api/subscribe', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    email: user.email,
                }),
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || 'Something went wrong');
            }

            document.getElementById('status').innerText = '✅ Subscription confirmed!';
            document.getElementById('details').innerText = `Subscribed at ${new Date()}`;


        })();
    </script>
</body>

</html>
